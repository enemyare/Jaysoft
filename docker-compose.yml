version: "3.7"

services:
  nginx:
    image: nginx:stable-alpine
    ports:
     - "80:80"
    volumes: 
     - "./nginx.conf:/etc/nginx/nginx.conf"
    depends_on:
     - meroswebapi
     - frontend
    networks:
     - rb-network

  meroswebapi:
    container_name: meros_web_api
    image: ${DOCKER_REGISTRY-}meroswebapi
    build:
      context: ./Backend
      dockerfile: Dockerfile
    networks:
      - rb-network
    depends_on:
      - mongodb

  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - rb-network

  mongodb:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    container_name: mongodb
    restart: unless-stopped
    env_file: .env   
    ports:
      - 27017:27017
    command: --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all --port 27017
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017'}]}) }" | mongosh --port 27017 -u root -p root --authenticationDatabase admin
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 4
    volumes:
      - database-data:/data/db
      - ./data/mongodb:/data
    networks:
      - rb-network

name: meros_applicatoin
networks:
  rb-network:
    driver: bridge
volumes:
  database-data: {}

